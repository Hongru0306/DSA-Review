[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-review"
version = "0.1.0"
description = "DSA-Review: Dual-Subgraph Alignment for Context-Aware Construction Document Review"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools]
py-modules = ["config", "encoder"]

[tool.setuptools.packages.find]
include = ["retrieval*", "graph*", "generation*", "evaluation*", "llm*", "utils*", "benchmarks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
